<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>storaged · Object Storage</title>
<!--
  Dashboard UI adapted from jenninexus/dashboard (MIT):
  https://github.com/jenninexus/dashboard — Aurora theme, profiles/seo.
  Modified: branding/content + live data injected via #seo-data.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ── Aurora theme tokens ───────────────────────────────────────────── */
:root {
  --bg:        #070b14;
  --bg2:       #0c1220;
  --surface:   rgba(77,159,255,0.05);
  --surface2:  rgba(77,159,255,0.09);
  --border:    rgba(77,159,255,0.14);
  --border2:   rgba(77,159,255,0.32);
  --text:      #e8eeff;
  --dim:       #7a90b8;
  --dim2:      #3a4a68;
  --bright:    #ffffff;
  --primary:     #4d9fff;
  --primary-rgb: 77,159,255;
  --secondary:   #00f5d4;
  --accent:      #9b72ff;
  --blue:        #60b4ff;
  --teal:        #1de9c0;
  --indigo:      #3d4fff;
  --red:         #ff6b8a;
  --yellow:      #ffb347;
  --green:       #39e8a0;
  --glow:        rgba(77,159,255,0.14);
  --card-radius: 14px;
  --blur:        22px;
  --mono:        'JetBrains Mono','Cascadia Code',monospace;
  --sans:        'Outfit','Segoe UI',system-ui,sans-serif;
  --heading:     'Outfit','Segoe UI',system-ui,-apple-system,sans-serif;
}
[data-theme="light"] {
  --bg:       #f0f4fb;
  --bg2:      #e6ecf7;
  --surface:  rgba(255,255,255,0.88);
  --surface2: rgba(255,255,255,0.97);
  --border:   rgba(30,60,140,0.10);
  --border2:  rgba(30,60,140,0.20);
  --text:     #0e1830;
  --dim:      #5070a8;
  --dim2:     #a0b0d0;
  --bright:   #070b14;
  --glow:     rgba(77,159,255,0.10);
}

/* ── Reset & base ─────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.55;
  min-height:100vh;
  overflow-x:hidden;
}

/* Aurora shimmer background */
body::before{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background:
    radial-gradient(ellipse 70% 50% at 15% 0%,   rgba(77,159,255,0.10),transparent 65%),
    radial-gradient(ellipse 55% 45% at 85% 5%,   rgba(0,245,212,0.07),transparent 60%),
    radial-gradient(ellipse 45% 35% at 50% 20%,  rgba(155,114,255,0.06),transparent 65%),
    radial-gradient(ellipse 60% 40% at 10% 90%,  rgba(0,245,212,0.05),transparent 55%),
    radial-gradient(ellipse 50% 45% at 95% 80%,  rgba(77,159,255,0.07),transparent 60%);
}

/* Subtle scan-line overlay */
body::after{
  content:'';
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  background:repeating-linear-gradient(
    0deg,
    transparent,
    transparent 2px,
    rgba(0,0,0,0.03) 2px,
    rgba(0,0,0,0.03) 4px
  );
  opacity:.6;
}

.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:0 1.6rem 4rem}
a{color:var(--secondary);text-decoration:none}
code{font-family:var(--mono);font-size:.84em;color:var(--secondary)}

/* ── Header ─────────────────────────────────────────────────────────── */
.head{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-start;
  justify-content:space-between;
  gap:1rem;
  padding:1.6rem 0 .8rem;
}
.head-left{display:flex;align-items:flex-start;gap:.9rem}
.head h1{
  font-family:var(--heading);
  font-size:1.9rem;
  font-weight:800;
  background:linear-gradient(110deg,var(--primary) 0%,var(--secondary) 45%,var(--accent) 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:-.01em;
  line-height:1.2;
}
.head .meta{font-size:.72rem;color:var(--dim);margin-top:.3rem;font-family:var(--mono)}
.head-right{display:flex;align-items:center;gap:.5rem;flex-shrink:0;padding-top:.2rem}
.theme-btn{
  background:transparent;
  border:1px solid var(--border2);
  color:var(--dim);
  border-radius:6px;
  padding:.28rem .65rem;
  font-size:.6rem;
  font-family:var(--mono);
  cursor:pointer;
  text-transform:uppercase;
  letter-spacing:.06em;
  transition:.15s;
}
.theme-btn:hover{color:var(--primary);border-color:var(--primary)}

/* ── Tabs ────────────────────────────────────────────────────────────── */
.tabs{display:flex;gap:.3rem;margin-bottom:1.2rem;border-bottom:1px solid var(--border)}
.tab{
  padding:.5rem 1.1rem;
  font-size:.72rem;
  font-weight:600;
  font-family:var(--mono);
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--dim);
  cursor:pointer;
  border-bottom:2px solid transparent;
  margin-bottom:-1px;
  transition:.15s;
}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab:hover:not(.active){color:var(--text)}

/* ── KPI Stats bar ───────────────────────────────────────────────────── */
.stats-bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.2rem}
.kpi{
  flex:1;min-width:110px;
  background:var(--surface);
  backdrop-filter:blur(var(--blur));
  border:1px solid var(--border);
  border-radius:10px;
  padding:.6rem .85rem;
  text-align:center;
  position:relative;
  overflow:hidden;
}
.kpi::before{
  content:'';position:absolute;top:0;left:10%;right:10%;height:1px;
  background:linear-gradient(90deg,transparent,var(--primary),transparent);
  opacity:.5;
}
.kpi .n{
  font-size:1.1rem;font-weight:800;
  color:var(--primary);
  font-variant-numeric:tabular-nums;
  font-family:var(--mono);
}
.kpi .l{font-size:.57rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin-top:.1rem}

/* ── Expand/collapse controls ────────────────────────────────────────── */
.controls{display:flex;justify-content:flex-end;gap:.35rem;margin-bottom:.85rem}
.ctrl-btn{
  padding:4px 11px;
  font-size:.59rem;font-family:var(--mono);font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;
  color:var(--dim);background:transparent;
  border:1px solid var(--border);border-radius:5px;
  cursor:pointer;transition:.15s;
}
.ctrl-btn:hover{color:var(--primary);border-color:var(--border2)}
.ctrl-btn.danger{color:var(--red);border-color:rgba(255,107,138,.3)}
.ctrl-btn.danger:hover{border-color:var(--red)}
.ctrl-btn:disabled{opacity:.45;cursor:wait}

/* ── Card ────────────────────────────────────────────────────────────── */
.card{
  background:var(--surface);
  backdrop-filter:blur(var(--blur));
  border:1px solid var(--border);
  border-radius:var(--card-radius);
  margin-bottom:1rem;
  overflow:hidden;
  position:relative;
  animation:fadeUp .45s both;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--card-accent,var(--primary)),transparent);
  opacity:.75;
}
.card:nth-child(1){animation-delay:.04s}
.card:nth-child(2){animation-delay:.08s}
.card:nth-child(3){animation-delay:.12s}
.card:nth-child(4){animation-delay:.16s}
.card:nth-child(5){animation-delay:.20s}
.card:nth-child(6){animation-delay:.24s}
.card:nth-child(7){animation-delay:.28s}
.card:nth-child(8){animation-delay:.32s}
.card:nth-child(9){animation-delay:.36s}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

.card-head{
  display:flex;align-items:center;gap:.6rem;
  padding:.75rem 1rem;
  cursor:pointer;user-select:none;
  border-bottom:1px solid transparent;
  transition:background .15s;
}
.card.open .card-head{border-bottom-color:var(--border)}
.card-head:hover{background:var(--surface2)}
.card-head h2{
  font-family:var(--heading);flex:1;
  font-size:.72rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.1em;
  color:var(--bright);
  display:flex;align-items:center;gap:.5rem;
}
.card-head h2::before{
  content:'';width:3px;height:13px;border-radius:2px;
  background:linear-gradient(180deg,var(--card-accent,var(--primary)),var(--secondary));
}
.card-toggle{font-size:.58rem;color:var(--dim2);transition:transform .2s}
.card.open .card-toggle{transform:rotate(90deg)}
.card-body{padding:1rem;display:none}
.card.open .card-body{display:block}

.badge{
  font-size:.54rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:.1rem .42rem;border-radius:4px;
  background:rgba(var(--primary-rgb),.12);color:var(--primary);
  border:1px solid rgba(var(--primary-rgb),.28);
}
.badge.ok{background:rgba(57,232,160,.12);color:var(--green);border-color:rgba(57,232,160,.28)}

/* ── Tables ──────────────────────────────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:.74rem}
th{
  text-align:left;padding:.45rem .6rem;
  color:var(--dim);font-size:.58rem;text-transform:uppercase;letter-spacing:.05em;
  border-bottom:1px solid var(--border);
}
td{padding:.48rem .6rem;border-bottom:1px solid rgba(77,159,255,.06);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.highlight td{background:rgba(77,159,255,.06)}

/* ── Progress bars ───────────────────────────────────────────────────── */
.pbar-wrap{display:flex;align-items:center;gap:.6rem}
.pbar-track{flex:1;height:6px;background:var(--bg2);border-radius:4px;overflow:hidden}
.pbar-fill{height:100%;border-radius:4px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.pbar-lbl{font-size:.64rem;font-weight:700;color:var(--dim);min-width:2.5rem;text-align:right;font-family:var(--mono)}

/* ── Status gauges ───────────────────────────────────────────────────── */
.psi-grid{display:flex;gap:1.2rem;flex-wrap:wrap;margin-bottom:1rem}
.psi-gauge{text-align:center;flex:1;min-width:110px}
.psi-ring{
  width:78px;height:78px;border-radius:50%;margin:0 auto .55rem;
  display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;font-weight:800;font-family:var(--mono);
  position:relative;
}
.psi-ring::before{
  content:'';position:absolute;inset:4px;border-radius:50%;
  background:var(--bg2);
}
.psi-ring span{position:relative;z-index:1}
.psi-label{font-size:.62rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.field-table{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.55rem}
.field{
  background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:.65rem .85rem;
}
.field .k{font-size:.58rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.field .v{font-size:.85rem;font-weight:700;font-family:var(--mono);margin-top:.15rem;word-break:break-all}
.field .v.good{color:var(--green)}
.field .v.warn{color:var(--yellow)}
.field .v.err{color:var(--red)}

/* ── Checklist ───────────────────────────────────────────────────────── */
.check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.4rem}
.check-item{
  display:flex;align-items:center;gap:.5rem;
  padding:.42rem .6rem;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:7px;font-size:.72rem;
}
.check-icon{font-size:.78rem;flex-shrink:0}
.check-pass .check-icon{color:var(--green)}
.check-warn .check-icon{color:var(--yellow)}
.check-fail .check-icon{color:var(--red)}

/* ── Milestones ──────────────────────────────────────────────────────── */
.timeline-scroll{overflow-x:auto;padding-bottom:.5rem}
.timeline-track{
  display:flex;align-items:center;gap:0;
  position:relative;min-width:600px;
  padding:1.5rem 1rem 1rem;
}
.timeline-track::before{
  content:'';position:absolute;
  top:calc(1.5rem + 10px);left:1rem;right:1rem;height:2px;
  border-top:2px dashed var(--border2);
}
.milestone{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:.35rem;
  position:relative;z-index:1;
}
.ms-dot{
  width:18px;height:18px;border-radius:50%;
  background:var(--primary);
  border:2px solid var(--bg);
  box-shadow:0 0 10px rgba(77,159,255,.5);
  flex-shrink:0;
}
.ms-dot.done{background:var(--green);box-shadow:0 0 10px rgba(57,232,160,.5)}
.ms-chip{
  font-size:.6rem;font-weight:600;
  font-family:var(--mono);
  background:var(--surface2);border:1px solid var(--border);
  border-radius:20px;padding:.2rem .55rem;
  color:var(--text);text-align:center;white-space:nowrap;
}
.ms-date{font-size:.56rem;color:var(--dim);text-align:center}

/* ── API methods ─────────────────────────────────────────────────────── */
.meth{
  font-size:.6rem;font-weight:700;
  padding:.08rem .4rem;border-radius:4px;font-family:var(--mono);
  background:rgba(var(--primary-rgb),.12);color:var(--primary);
  border:1px solid rgba(var(--primary-rgb),.28);
}
.meth.GET{background:rgba(57,232,160,.12);color:var(--green);border-color:rgba(57,232,160,.3)}
.meth.POST{background:rgba(255,179,71,.12);color:var(--yellow);border-color:rgba(255,179,71,.3)}
.meth.PUT{background:rgba(77,159,255,.12);color:var(--blue);border-color:rgba(77,159,255,.3)}
.meth.DELETE{background:rgba(255,107,138,.12);color:var(--red);border-color:rgba(255,107,138,.3)}
.api-path{font-family:var(--mono);font-size:.7rem}

/* ── Code block ──────────────────────────────────────────────────────── */
.code-block{
  background:var(--bg2);border:1px solid var(--border);
  border-radius:10px;padding:1rem;font-family:var(--mono);
  font-size:.74rem;line-height:1.7;overflow-x:auto;color:var(--text);
}
.code-block .c{color:var(--dim)}
.code-block .hl{color:var(--secondary)}

/* ── Toolbar / inputs (Files tab) ────────────────────────────────────── */
.toolbar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:.85rem}
.toolbar input,.toolbar select,.toolbar .tb-text{
  font-family:var(--mono);font-size:.72rem;
  background:var(--bg2);color:var(--text);
  border:1px solid var(--border);border-radius:6px;
  padding:.3rem .5rem;
}
.toolbar input:focus,.toolbar select:focus{border-color:var(--border2);outline:none}
.tb-label{font-size:.56rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.crumbs{display:flex;gap:.3rem;flex-wrap:wrap;align-items:center;margin-bottom:.8rem}
.crumb{
  font-size:.68rem;font-family:var(--mono);color:var(--dim);
  cursor:pointer;padding:.12rem .35rem;border-radius:4px;
}
.crumb:hover{color:var(--primary);background:var(--surface2)}
.crumb.sep{color:var(--dim2);cursor:default}
.keylbl{font-family:var(--mono);font-size:.72rem;word-break:break-all}
.file-kind{font-size:.78rem}
.thumb{width:42px;height:42px;object-fit:cover;border-radius:7px;border:1px solid var(--border)}
.media{max-width:100%;max-height:70vh;border-radius:8px}

/* ── Modal ───────────────────────────────────────────────────────────── */
#fb-modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:1.2rem;background:rgba(0,0,0,.78)}
#fb-modal.open{display:flex}
#fb-modal .mw{position:relative;width:min(92vw,980px);max-height:90vh;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
#fb-modal .mh{display:flex;align-items:center;gap:.6rem;padding:.6rem .9rem;border-bottom:1px solid var(--border)}
#fb-modal .mh h3{flex:1;font-family:var(--mono);font-size:.72rem;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
#fb-modal .mb{overflow:auto;display:flex;align-items:center;justify-content:center;min-height:180px;padding:1rem}

/* frame + text arrow, toast */
#fb-pager-frame{display:block;margin-top:.6rem;text-align:center}
.toast{
  position:fixed;left:50%;bottom:1.4rem;transform:translateX(-50%);
  z-index:80;background:var(--bg2);border:1px solid var(--border2);
  color:var(--text);font-family:var(--mono);font-size:.72rem;
  padding:.5rem .9rem;border-radius:8px;max-width:88vw;box-shadow:0 8px 30px rgba(0,0,0,.5);
  display:none;
}
.toast.show{display:block;animation:fadeUp .25s both}

/* ── Footer ──────────────────────────────────────────────────────────── */
.foot{
  margin-top:2rem;padding-top:1rem;border-top:1px solid var(--border);
  font-family:var(--mono);font-size:.64rem;color:var(--dim2);
  display:grid;gap:.4rem;text-align:center;
}
.foot strong{font-family:var(--heading);color:var(--text);font-size:.76rem}
.foot a{color:var(--primary);opacity:.75}
.foot a:hover{opacity:1}

/* ── Responsive ──────────────────────────────────────────────────────── */
@media(max-width:600px){
  .stats-bar{gap:.35rem}
  .kpi{min-width:90px}
  .kpi .n{font-size:.9rem}
  .psi-grid{justify-content:center}
}
@media print{.controls,.theme-btn,.tabs{display:none}.card-body{display:block!important}}
</style>
</head>
<body>

<div class="wrap">

  <!-- Header -->
  <div class="head">
    <div class="head-left">
      <div>
        <h1>storaged</h1>
        <div class="meta" id="head-meta">object storage &nbsp;·&nbsp; loading…</div>
      </div>
    </div>
    <div class="head-right">
      <button class="theme-btn" onclick="toggleTheme()"><span id="themeIcon">☾</span> <span id="themeLabel">Dark</span></button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('overview',this)">Overview</div>
    <div class="tab" onclick="switchTab('files',this)">Files</div>
    <div class="tab" onclick="switchTab('api',this)">API</div>
  </div>

  <!-- Overview tab -->
  <div id="tab-overview">

    <!-- KPI Stats Bar -->
    <div class="stats-bar" id="stats-bar"></div>

    <div class="controls">
      <button class="ctrl-btn" onclick="allCards(true)">expand all</button>
      <button class="ctrl-btn" onclick="allCards(false)">collapse all</button>
    </div>

    <!-- 1. Live Status -->
    <div class="card open" id="card-status" style="--card-accent:var(--primary)">
      <div class="card-head" onclick="tog(this)">
        <h2>Live Status</h2>
        <span class="badge" id="status-badge">…</span>
        <span class="card-toggle">▸</span>
      </div>
      <div class="card-body" id="status-body"></div>
    </div>

    <!-- 2. Buckets -->
    <div class="card open" id="card-buckets" style="--card-accent:var(--secondary)">
      <div class="card-head" onclick="tog(this)">
        <h2>Buckets</h2>
        <span class="card-toggle">▸</span>
      </div>
      <div class="card-body" id="buckets-body"></div>
    </div>

    <!-- 3. Transfers -->
    <div class="card open" id="card-transfers" style="--card-accent:var(--yellow)">
      <div class="card-head" onclick="tog(this)">
        <h2>Transfers</h2>
        <span class="badge" id="tf-badge">…</span>
        <span class="card-toggle">▸</span>
      </div>
      <div class="card-body" id="transfers-body"></div>
    </div>

    <!-- Durability & Hardening -->
    <div class="card open" id="card-checks" style="--card-accent:var(--green)">
      <div class="card-head" onclick="tog(this)">
        <h2>Durability &amp; Hardening</h2>
        <span class="badge ok">enabled</span>
        <span class="card-toggle">▸</span>
      </div>
      <div class="card-body" id="checks-body"></div>
    </div>

    <!-- Lifecycle -->
    <div class="card open" id="card-milestones" style="--card-accent:var(--indigo)">
      <div class="card-head" onclick="tog(this)">
        <h2>Lifecycle</h2>
        <span class="card-toggle">▸</span>
      </div>
      <div class="card-body" id="milestones-body"></div>
    </div>

  </div><!-- /tab-overview -->

  <!-- Files tab -->
  <div id="tab-files" style="display:none">
    <div class="card open" id="card-files" style="--card-accent:var(--teal)">
      <div class="card-head" onclick="tog(this)">
        <h2>Objects &amp; Media</h2>
        <span class="card-toggle">▸</span>
      </div>
      <div class="card-body" id="files-body"></div>
    </div>
  </div><!-- /tab-files -->

  <!-- API tab -->
  <div id="tab-api" style="display:none">
    <div class="card open" id="card-endpoints" style="--card-accent:var(--teal)">
      <div class="card-head" onclick="tog(this)">
        <h2>REST API</h2>
        <span class="card-toggle">▸</span>
      </div>
      <div class="card-body" id="endpoints-body"></div>
    </div>

    <div class="card open" id="card-quickstart" style="--card-accent:var(--accent)">
      <div class="card-head" onclick="tog(this)">
        <h2>Quickstart</h2>
        <span class="card-toggle">▸</span>
      </div>
      <div class="card-body" id="quickstart-body"></div>
    </div>
  </div>

  <div class="foot">
    <strong>storaged — self-hosted object storage</strong>
    <span>API adapted from <a href="https://github.com/jenninexus/dashboard" target="_blank" rel="noopener">jenninexus/dashboard</a> (MIT) · Aurora theme</span>
  </div>

</div><!-- /wrap -->

<!-- Media preview modal -->
<div id="fb-modal">
  <div class="mw">
    <div class="mh">
      <h3 id="fb-modal-title"></h3>
      <button class="ctrl-btn" onclick="closeModal()">close</button>
    </div>
    <div class="mb" id="fb-modal-body"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- ── Live data (injected by the daemon at request time) ────────────── -->
<script id="seo-data" type="application/json">__DASHBOARD__</script>

<script>
'use strict';
const D = JSON.parse(document.getElementById('seo-data').textContent);
const $ = id => document.getElementById(id);

// ── Theme ────────────────────────────────────────────────────────────
function toggleTheme() {
  const h = document.documentElement;
  const isDark = h.getAttribute('data-theme') === 'dark';
  h.setAttribute('data-theme', isDark ? 'light' : 'dark');
  $('themeIcon').textContent = isDark ? '☀' : '☾';
  $('themeLabel').textContent = isDark ? 'Light' : 'Dark';
  localStorage.setItem('seo-theme', isDark ? 'light' : 'dark');
}
if (localStorage.getItem('seo-theme') === 'light') toggleTheme();

// ── Tabs ─────────────────────────────────────────────────────────────
function switchTab(id, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  $('tab-overview').style.display = id === 'overview' ? '' : 'none';
  $('tab-files').style.display = id === 'files' ? '' : 'none';
  $('tab-api').style.display = id === 'api' ? '' : 'none';
  if (id === 'files') refreshFiles();
}

// ── Card collapse ────────────────────────────────────────────────────
function tog(head) {
  const card = head.closest('.card');
  card.classList.toggle('open');
  saveCards();
}
function allCards(open) {
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('open', open));
  saveCards();
}
function saveCards() {
  const state = {};
  document.querySelectorAll('.card[id]').forEach(c => { state[c.id] = c.classList.contains('open'); });
  localStorage.setItem('stu-cards', JSON.stringify(state));
}
function restoreCards() {
  try {
    const state = JSON.parse(localStorage.getItem('stu-cards') || '{}');
    Object.entries(state).forEach(([id, open]) => {
      const el = $(id);
      if (el) el.classList.toggle('open', open);
    });
  } catch(e) {}
}

// ── Header ───────────────────────────────────────────────────────────
$('head-meta').textContent =
  (D.profile.publicUrl || 'object storage') + ' · ' + (D.profile.node ? 'node ' + D.profile.node : '') + ' · ' + D.profile.asOf;

// ── KPI bar ──────────────────────────────────────────────────────────
$('stats-bar').innerHTML = D.kpis.map(k =>
  `<div class="kpi"><div class="n">${k.value}</div><div class="l">${k.label}</div></div>`
).join('');

// ── Shared helpers ───────────────────────────────────────────────────
let myBuckets = D.buckets || [];
let bucketPublic = {};
(D.buckets || []).forEach(b => { bucketPublic[b.name] = !!b.public; });

function esc(v) {
  return String(v || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function fmtSize(n) {
  if (!n && n !== 0) return '0 B';
  if (n < 1024) return n + ' B';
  let f = n;
  for (const u of ['KiB','MiB','GiB','TiB','PiB']) {
    f /= 1024;
    if (f < 1024) return f.toFixed(1) + ' ' + u;
  }
  return f.toFixed(1) + ' EiB';
}
function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  return isNaN(d) ? '' : d.toLocaleString();
}
function apiKey() { return localStorage.getItem('stu-admin-key') || localStorage.getItem('stu-tf-key') || ''; }
function setApiKey(v) {
  localStorage.setItem('stu-admin-key', v);
  localStorage.setItem('stu-tf-key', v);
  const els = document.querySelectorAll('[data-key-sync]');
  els.forEach(el => { if (el.value !== v) el.value = v; });
}
function hdrs(extra) {
  const h = Object.assign({}, extra);
  const k = apiKey();
  if (k) h['Authorization'] = 'Bearer ' + k;
  return h;
}
async function apiFetch(path, opts) {
  const res = await fetch(location.origin + path, Object.assign({}, opts, { headers: hdrs(opts && opts.headers) }));
  if (!res.ok) {
    let msg = res.statusText;
    try { const e = await res.json(); if (e.error) msg = e.error; } catch(err) {}
    const err = new Error(msg);
    err.status = res.status;
    throw err;
  }
  return res;
}
function toast(msg, isErr) {
  const t = $('toast');
  t.textContent = msg;
  t.style.borderColor = isErr ? 'rgba(255,107,138,.5)' : 'var(--border2)';
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 3200);
}

// ── Live Status ──────────────────────────────────────────────────────
(function(){
  const s = D.status;
  const badge = $('status-badge');
  badge.textContent = s.writes ? 'writes: on' : 'read-only';
  badge.className = 'badge' + (s.writes ? ' ok' : '');

  function gauge(label, score, grade, sub) {
    const color = grade === 'pass' ? 'var(--green)' : grade === 'warn' ? 'var(--yellow)' : 'var(--red)';
    const deg = Math.max(0, Math.min(100, score)) / 100 * 360;
    return `<div class="psi-gauge">
      <div class="psi-ring" style="background:conic-gradient(${color} ${deg}deg, var(--bg2) ${deg}deg)">
        <span style="color:${color}">${sub !== undefined ? sub : Math.round(score)}</span>
      </div>
      <div class="psi-label">${label}</div>
    </div>`;
  }

  const fields = [
    { k: 'Node',           v: s.node },
    { k: 'Role',           v: s.role, cls: s.role === 'leader' ? 'good' : 'warn' },
    { k: 'Started at',     v: s.started },
    { k: 'Op log LSN',     v: s.lsn },
    { k: 'Replication',    v: s.watermark !== null ? s.watermark + ' (watermark)' : 'leader (writer)', cls: s.watermark !== null ? 'good' : '' },
    { k: 'Active uploads', v: s.active, cls: s.active ? 'warn' : 'good' },
    { k: 'Objects',        v: D.kpis[2] ? D.kpis[2].value : s.objects },
    { k: 'Blobs on disk',  v: D.kpis[3] ? D.kpis[3].value : s.blobs }
  ].map(f => `<div class="field"><div class="k">${f.k}</div><div class="v${f.cls ? ' ' + f.cls : ''}">${f.v}</div></div>`).join('');

  $('status-body').innerHTML =
    `<div class="psi-grid">
       ${gauge('Write availability', s.writes ? 100 : 30, s.writes ? 'pass' : 'warn', s.writes ? '100' : 'lo')}
       ${gauge('Replication sync', s.watermark !== null && s.lsn > 0 ? Math.round(s.watermark / s.lsn * 100) : 100, s.watermark !== null ? 'pass' : 'warn', s.watermark !== null && s.lsn > 0 ? Math.round(s.watermark / s.lsn * 100) : 'n/a')}
     </div>
     <div class="field-table">${fields}</div>`;
})();

// ── Buckets: render, create, delete ──────────────────────────────────
function renderBuckets() {
  const k = apiKey();
  const rows = myBuckets.map(b => {
    const pct = Math.max(1, Math.round((b.objects / Math.max(1, D.bucketsMax)) * 100));
    return `<tr>
      <td><strong>${esc(b.name)}</strong> ${b.public ? '<span class="badge ok" style="margin-left:.3rem">public</span>' : '<span class="badge">private</span>'}</td>
      <td style="font-family:var(--mono);font-weight:700;color:var(--primary)">${(b.objects||0).toLocaleString()}</td>
      <td style="font-family:var(--mono)">${esc(b.sizeH || fmtSize(b.size))}</td>
      <td style="width:34%">
        <div class="pbar-wrap">
          <div class="pbar-track"><div class="pbar-fill" style="width:${pct}%;background:var(--secondary)"></div></div>
          <div class="pbar-lbl">${pct}%</div>
        </div>
      </td>
      <td style="text-align:right;white-space:nowrap">
        <button class="ctrl-btn" onclick="openBucket('${esc(b.name)}')">open</button>
        ${k ? `<button class="ctrl-btn" onclick="deleteBucket('${esc(b.name)}')">delete</button>` : ''}
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="5" style="color:var(--dim)">no buckets yet — create one below</td></tr>';

  $('buckets-body').innerHTML = `
    <div class="toolbar">
      <span class="tb-label">API key</span>
      <input id="admin-key" type="password" placeholder="admin bearer (create / delete buckets)" value="${esc(k)}"
             data-key-sync style="flex:1;min-width:220px"
             oninput="setApiKey(this.value)">
    </div>
    <div class="toolbar">
      <span class="tb-label">New bucket</span>
      <input id="new-bucket-name" type="text" placeholder="name (3-63 chars, a-z 0-9 -)" style="flex:1;min-width:200px">
      <label style="display:flex;align-items:center;gap:.4rem;font-size:.58rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;cursor:pointer;margin-left:.4rem">
        <input id="new-bucket-public" type="checkbox"> public
      </label>
      <button class="ctrl-btn" onclick="createBucket()" style="background:rgba(var(--primary-rgb),.15);color:var(--primary);border-color:rgba(var(--primary-rgb),.3)">create</button>
      <button class="ctrl-btn" onclick="loadBuckets()">refresh</button>
    </div>
    <div style="overflow-x:auto">
      <table>
        <thead><tr><th>Bucket</th><th>Objects</th><th>Size</th><th>Share</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

async function apiBuckets() {
  const res = await apiFetch('/v1/buckets');
  const d = await res.json();
  return d.buckets || [];
}

async function loadBuckets() {
  const k = apiKey();
  if (!k) { myBuckets = D.buckets || []; renderBuckets(); return; }
  try {
    const buck = await apiBuckets();
    myBuckets = buck;
    buck.forEach(b => { bucketPublic[b.name] = !!b.is_public; });
    renderBuckets();
  } catch (err) {
    toast('list buckets: ' + err.message, true);
  }
}

async function createBucket() {
  const k = apiKey();
  if (!k) return toast('enter an admin API key first', true);
  const nameEl = $('new-bucket-name');
  const name = (nameEl.value || '').trim();
  if (!name) return toast('enter a bucket name', true);
  const pub = !!$('new-bucket-public').checked;
  const btn = event && event.target;
  if (btn) btn.disabled = true;
  try {
    const res = await apiFetch('/v1/buckets/' + encodeURIComponent(name) + '?public=' + pub, { method: 'PUT' });
    const d = await res.json();
    nameEl.value = '';
    $('new-bucket-public').checked = false;
    toast('bucket created: ' + (d.bucket && d.bucket.name ? d.bucket.name : name));
    loadBuckets();
  } catch (err) {
    toast('create bucket: ' + err.message, true);
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function deleteBucket(name) {
  if (!confirm('Delete bucket "' + name + '" entirely?')) return;
  try {
    await apiFetch('/v1/buckets/' + encodeURIComponent(name), { method: 'DELETE' });
    toast('bucket deleted: ' + name);
    if (FB.bucket === name) { FB.bucket = ''; FB.prefix = ''; }
    loadBuckets();
  } catch (err) {
    toast('delete bucket: ' + err.message, true);
  }
}

function openBucket(name) {
  FB.bucket = name;
  FB.prefix = '';
  FB.q = '';
  FB.after = '';
  switchTab('files', document.querySelectorAll('.tab')[1]);
  loadFiles(true);
}

renderBuckets();
if (apiKey()) loadBuckets();

// ── Files / Objects browser ──────────────────────────────────────────
const FB = {
  bucket: '',
  prefix: '',
  q: '',
  after: '',
  entries: [],
  folders: [],
  next: '',
  loading: false
};

function objPath(b, key) {
  return '/v1/buckets/' + encodeURIComponent(b) + '/objects/' +
    key.split('/').map(encodeURIComponent).join('/');
}
function publicPath(b, key) {
  return '/v1/public/' + encodeURIComponent(b) + '/' +
    key.split('/').map(encodeURIComponent).join('/');
}
function isPublicBucket() { return !!bucketPublic[FB.bucket]; }

function refreshFiles() {
  const wrap = $('files-body');
  const k = apiKey();
  const opts = (D.buckets || []).concat(myBuckets.filter(b => !(D.buckets || []).some(x => x.name === b.name)))
    .map(b => `<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('');
  if (!k) {
    wrap.innerHTML = `<div style="padding:.5rem;background:var(--surface2);border:1px solid var(--border);border-radius:7px;font-size:.66rem;color:var(--dim)">enter an API key (read or admin) to browse objects — use the field in the Buckets card or below</div>
      <div class="toolbar" style="margin-top:.6rem"><span class="tb-label">API key</span>
        <input data-key-sync type="password" placeholder="bearer key" style="flex:1;min-width:220px" value="${esc(k)}" oninput="setApiKey(this.value)"></div>`;
    return;
  }
  wrap.innerHTML = `
    <div class="toolbar">
      <span class="tb-label">Bucket</span>
      <select id="fb-bucket" style="min-width:160px" onchange="changeBucket(this.value)">${opts}</select>
      <button class="ctrl-btn" onclick="loadFiles(true)">refresh</button>
      ${FB.bucket ? `<button class="ctrl-btn" onclick="switchTab('overview',document.querySelector('.tab'))" title="back to buckets">buckets</button>` : ''}
    </div>
    <div id="fb-crumbs" style="min-height:1.4rem"></div>
    <div class="toolbar">
      <input id="fb-q" type="text" placeholder="search names…" value="${esc(FB.q)}" style="flex:1;min-width:160px" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="ctrl-btn" onclick="doSearch()">search</button>
      <span class="tb-label">Upload</span>
      <input id="fb-folder" type="text" placeholder="folder (opt)" title="prefix folder, e.g. videos/season1" style="width:130px" onkeydown="if(event.key==='Enter')doUpload()">
      <input id="fb-file" type="file" style="max-width:190px">
      <button class="ctrl-btn" onclick="doUpload()" style="background:rgba(var(--primary-rgb),.15);color:var(--primary);border-color:rgba(var(--primary-rgb),.3)">upload</button>
    </div>
    <div style="overflow-x:auto"><table id="fb-table"></table></div>
    <span id="fb-pager-frame"></span>`;
  const sel = $('fb-bucket');
  if (FB.bucket) sel.value = FB.bucket;
  renderCrumbs();
  renderFilesTable();
}

function changeBucket(name) {
  FB.bucket = name;
  FB.prefix = ''; FB.q = ''; FB.after = '';
  $('fb-q').value = '';
  renderCrumbs();
  loadFiles(true);
}

function renderCrumbs() {
  const el = $('fb-crumbs');
  if (!el) return;
  if (!FB.bucket) { el.innerHTML = '<div class="crumbs"><span class="crumb">select a bucket to browse objects</span></div>'; return; }
  const parts = FB.prefix ? FB.prefix.split('/').filter(Boolean) : [];
  let acc = '';
  let html = '<div class="crumbs"><span class="crumb" onclick="navigateFolder(\'\')">' + esc(FB.bucket) + ' /</span>';
  parts.forEach(p => {
    acc = acc ? acc + p + '/' : p + '/';
    html += `<span class="crumb sep">/</span><span class="crumb" onclick="navigateFolder('${esc(acc)}')">${esc(p)}</span>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

async function loadFiles(isFresh) {
  if (FB.loading) return;
  FB.loading = true;
  const tbl = $('fb-table');
  try {
    if (!FB.bucket) {
      const bucketNames = (D.buckets || []).map(b => b.name);
      if (bucketNames.length) FB.bucket = bucketNames[0];
      else { if (tbl) tbl.innerHTML = '<tr><td style="color:var(--dim)">no buckets — create one from the Overview tab</td></tr>'; return; }
    }
    if (isFresh) { FB.after = ''; }
    const q = [];
    if (FB.prefix) q.push('prefix=' + encodeURIComponent(FB.prefix));
    if (FB.q) q.push('q=' + encodeURIComponent(FB.q));
    if (FB.after) q.push('after=' + encodeURIComponent(FB.after));
    q.push('delimiter=/'); q.push('limit=200');
    const res = await apiFetch('/v1/buckets/' + encodeURIComponent(FB.bucket) + '/objects?' + q.join('&'));
    const d = await res.json();
    FB.entries = d.entries || [];
    FB.folders = d.folders || [];
    FB.next = d.next || '';
    if (!FB.after && isFresh) FB.after = '';
    const sel = $('fb-bucket');
    if (sel && FB.bucket && sel.value !== FB.bucket) sel.value = FB.bucket;
    renderFilesTable();
  } catch (err) {
    if (tbl) tbl.innerHTML = '<tr><td style="color:var(--red);font-family:var(--mono)">' + esc(err.message) + '</td></tr>';
  } finally {
    FB.loading = false;
  }
}

function kindOf(e) {
  const ct = (e.content_type || '');
  if (ct.indexOf('image/') === 0) return 'image';
  if (ct.indexOf('video/') === 0) return 'video';
  if (ct.indexOf('audio/') === 0) return 'audio';
  if (ct === 'application/pdf') return 'pdf';
  const ext = (e.key || '').toLowerCase().split('.').pop();
  if (!ct || ct === 'application/octet-stream' || ct === 'binary/octet-stream') {
    if (['jpg','jpeg','png','gif','webp','bmp','avif'].indexOf(ext) >= 0) return 'image';
    if (['mp4','webm','mkv','mov','avi','m4v'].indexOf(ext) >= 0) return 'video';
    if (['mp3','wav','ogg','m4a','flac','aac'].indexOf(ext) >= 0) return 'audio';
    if (ext === 'pdf') return 'pdf';
  }
  return 'file';
}

function renderFilesTable() {
  const tbl = $('fb-table');
  if (!tbl) return;
  const k = apiKey();
  let rows = '';
  FB.folders.forEach(f => {
    rows += `<tr>
      <td class="file-kind" style="color:var(--secondary);width:34px">📁</td>
      <td><strong class="keylbl" style="color:var(--secondary);cursor:pointer" onclick="navigateFolder('${esc(f)}')">${esc(f)}</strong></td>
      <td style="color:var(--dim)"></td>
      <td style="color:var(--dim)">folder</td>
      <td style="color:var(--dim2)"></td>
      <td style="text-align:right"><button class="ctrl-btn" onclick="navigateFolder('${esc(f)}')">open</button></td>
    </tr>`;
  });
  FB.entries.forEach(e => {
    const kind = kindOf(e);
    const icon = kind === 'image' ? '🖼' : kind === 'video' ? '▶' : kind === 'audio' ? '♪' : kind === 'pdf' ? '📄' : '🗎';
    rows += `<tr>
      <td class="file-kind" style="width:34px">${icon}</td>
      <td><span class="keylbl">${esc(e.key)}</span></td>
      <td style="font-family:var(--mono);white-space:nowrap">${fmtSize(e.size)}</td>
      <td style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--dim)" title="${esc(e.content_type)}">${esc(e.content_type || '')}</td>
      <td style="color:var(--dim2);white-space:nowrap">${fmtDate(e.updated_at)}</td>
      <td style="text-align:right;white-space:nowrap">
        <button class="ctrl-btn" onclick="previewEntry(${FB.entries.indexOf(e)})">preview</button>
        <button class="ctrl-btn" onclick="downloadEntry(${FB.entries.indexOf(e)})">get</button>
        ${k ? `<button class="ctrl-btn danger" onclick="deleteEntry(${FB.entries.indexOf(e)})">del</button>` : ''}
      </td>
    </tr>`;
  });
  if (!rows) rows = '<tr><td colspan="6" style="color:var(--dim)">no objects here' + (FB.q ? ' matching "' + esc(FB.q) + '"' : '') + '</td></tr>';
  tbl.innerHTML = `<thead><tr><th style="width:34px"></th><th>Key</th><th>Size</th><th>Type</th><th>Modified</th><th></th></tr></thead><tbody>${rows}</tbody>`;
  const frame = $('fb-pager-frame');
  if (frame) frame.innerHTML = FB.next
    ? `<button class="ctrl-btn" onclick="loadMore()" style="width:100%">load more…</button>`
    : (FB.folders.length || FB.entries.length ? `<span style="font-size:.58rem;color:var(--dim2);font-family:var(--mono)">— end of list —</span>` : '');
}

function navigateFolder(pfx) {
  FB.prefix = pfx || '';
  FB.q = '';
  FB.after = '';
  const qEl = $('fb-q'); if (qEl) qEl.value = '';
  renderCrumbs();
  loadFiles(true);
}

function doSearch() {
  const qEl = $('fb-q');
  FB.q = qEl ? qEl.value.trim() : '';
  FB.after = '';
  loadFiles(true);
}

function loadMore() {
  FB.after = FB.next;
  loadFiles(false);
}

async function doUpload() {
  const k = apiKey();
  if (!k) return toast('enter an admin API key first', true);
  if (!FB.bucket) return toast('select a bucket first', true);
  const fileEl = $('fb-file');
  const file = fileEl && fileEl.files[0];
  if (!file) return toast('choose a file to upload', true);
  const folderEl = $('fb-folder');
  const folder = folderEl ? folderEl.value.trim() : '';
  const key = (folder ? folder.replace(/\/+$/, '') + '/' : '') + file.name;
  const btn = event && event.target; if (btn) btn.disabled = true;
  toast('uploading ' + file.name + '…');
  try {
    await fetch(objPath(FB.bucket, key), {
      method: 'PUT',
      headers: hdrs({ 'Content-Type': file.type || 'application/octet-stream' }),
      body: file
    });
    if (fileEl) fileEl.value = '';
    toast('uploaded: ' + key);
    loadFiles(true);
  } catch (err) {
    toast('upload: ' + (err.message || err), true);
  } finally {
    if (btn) btn.disabled = false;
  }
}

function entrySrc(e) {
  if (e.is_public || isPublicBucket()) return publicPath(e.bucket, e.key);
  return null;
}

function previewEntry(i) {
  const e = FB.entries[i];
  if (!e) return;
  const kind = kindOf(e);
  const title = e.bucket + '/' + e.key;
  $('fb-modal-title').textContent = title;
  const body = $('fb-modal-body');
  const direct = entrySrc(e);
  if (direct) {
    body.innerHTML = mediaHtml(kind, direct);
    openModal();
    return;
  }
  body.innerHTML = '<div style="color:var(--dim);font-family:var(--mono);font-size:.68rem">loading…</div>';
  openModal();
  fetch(objPath(e.bucket, e.key), { headers: hdrs() })
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.blob();
    })
    .then(blob => {
      const url = URL.createObjectURL(blob);
      body.innerHTML = mediaHtml(kind, url);
      body.querySelectorAll('video,audio').forEach(m => { m.src = url; m.addEventListener('loadedmetadata', () => URL.revokeObjectURL(url), { once: true }); });
    })
    .catch(err => { body.innerHTML = '<div style="color:var(--red);font-family:var(--mono);font-size:.7rem">preview failed: ' + esc(err.message) + '</div>'; });
}

function mediaHtml(kind, src) {
  if (kind === 'image') return `<img class="media" src="${src}" alt="" onerror="this.style.display='none'">`;
  if (kind === 'video') return `<video class="media" controls autoplay preload="metadata" src="${src}"></video>`;
  if (kind === 'audio') return `<audio class="media" controls autoplay preload="metadata" src="${src}"></audio>`;
  if (kind === 'pdf') return `<iframe class="media" src="${src}" style="width:100%;min-height:70vh;border:none"></iframe>`;
  return `<div style="text-align:center;font-family:var(--mono);font-size:.68rem;color:var(--dim)">no inline preview for this file type</div>`;
}

function openModal() { $('fb-modal').classList.add('open'); }
function closeModal() {
  $('fb-modal').classList.remove('open');
  const body = $('fb-modal-body');
  body.querySelectorAll('video,audio').forEach(m => { m.pause(); });
  body.innerHTML = '';
}

function downloadEntry(i) {
  const e = FB.entries[i];
  if (!e) return;
  const direct = entrySrc(e);
  if (direct) { window.open(direct, '_blank'); return; }
  fetch(objPath(e.bucket, e.key), { headers: hdrs() })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
    .then(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = e.key.split('/').pop() || e.key;
      document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    })
    .catch(err => toast('download: ' + err.message, true));
}

async function deleteEntry(i) {
  const e = FB.entries[i];
  if (!e) return;
  if (!confirm('Trash object "' + e.bucket + '/' + e.key + '"?')) return;
  try {
    await apiFetch(objPath(e.bucket, e.key), { method: 'DELETE' });
    toast('trashed: ' + e.key);
    loadFiles(true);
  } catch (err) {
    toast('delete: ' + err.message, true);
  }
}

// ── Transfers ────────────────────────────────────────────────────────
(function(){
  const body = $('transfers-body');
  let tfKey = apiKey();
  let transfers = D.transfers || [];

  function tfPct(t) {
    if (t.status === 'done') return 100;
    if (!t.size) return 0;
    return Math.min(99, Math.round(t.progress / t.size * 100));
  }
  function tfSize(n) { return fmtSize(n); }
  function tfBadge(s) {
    const m = { queued:'bg', downloading:'bg ok', done:'ok', failed:'err', cancelled:'bg err' };
    return `<span class="badge ${m[s]||''}">${s}</span>`;
  }

  function render() {
    const rows = transfers.map(t => {
      const pct = tfPct(t);
      const barColor = t.status === 'done' ? 'var(--green)'
        : (t.status === 'failed' || t.status === 'cancelled') ? 'var(--red)'
        : 'var(--secondary)';
      const src = t.url || '';
      const active = (t.status === 'queued' || t.status === 'downloading');
      return `<tr>
        <td style="font-family:var(--mono);font-size:.64rem">${esc(t.id).slice(-12)}</td>
        <td><strong>${esc(t.bucket)}</strong></td>
        <td style="font-family:var(--mono);font-size:.72rem;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(src)}">${esc(t.key)}</td>
        <td>${tfBadge(t.status)}</td>
        <td style="font-family:var(--mono);font-size:.68rem">${tfSize(t.progress)}${t.size ? ' / ' + tfSize(t.size) : ''}</td>
        <td style="width:24%">
          <div class="pbar-wrap">
            <div class="pbar-track"><div class="pbar-fill" style="width:${pct}%;background:${barColor}"></div></div>
            <div class="pbar-lbl">${t.status === 'done' ? '✓' : pct + '%'}</div>
          </div>
        </td>
        <td style="font-size:.6rem;color:var(--dim);font-family:var(--mono)">${esc(t.kind)}</td>
        <td>${active ? `<button class="ctrl-btn" onclick="tfCancel('${esc(t.bucket)}','${esc(t.id)}')">cancel</button>` : ''}</td>
        ${t.error ? `<tr><td colspan="8" style="font-size:.64rem;color:var(--red);font-family:var(--mono)">${esc(t.error)}</td></tr>` : ''}
      </tr>`;
    }).join('');

    const canWrite = D.status && D.status.writes === true;
    const bucketOpts = (D.buckets || []).map(b => `<option value="${esc(b.name)}">${esc(b.name)}</option>`).join('');

    const activeCount = transfers.filter(t => t.status === 'queued' || t.status === 'downloading').length;
    const badge = $('tf-badge');
    badge.textContent = activeCount ? activeCount + ' active' : 'none';
    badge.className = 'badge' + (activeCount ? ' ok' : '');

    body.innerHTML = `
      ${canWrite ? `
      <div style="margin-bottom:1rem;padding:.85rem;background:var(--surface2);border:1px solid var(--border);border-radius:10px">
        <div style="display:flex;gap:.6rem;align-items:flex-end;flex-wrap:wrap">
          <div>
            <label style="display:block;font-size:.56rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.25rem">Bucket</label>
            <select id="tf-bucket" style="font-family:var(--mono);font-size:.72rem;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:.3rem .5rem">
              ${bucketOpts || '<option value="">(no buckets)</option>'}
            </select>
          </div>
          <div style="flex:1;min-width:240px">
            <label style="display:block;font-size:.56rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.25rem">URL / Magnet URI</label>
            <input id="tf-url" type="text" placeholder="https://example.com/big.iso   or   magnet:?xt=urn:btih:…" style="width:100%;font-family:var(--mono);font-size:.72rem;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:.3rem .5rem">
          </div>
          <div>
            <label style="display:block;font-size:.56rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:.25rem">Key (opt)</label>
            <input id="tf-key" type="text" placeholder="folder/path" style="width:130px;font-family:var(--mono);font-size:.72rem;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:.3rem .5rem">
          </div>
          <button class="ctrl-btn" onclick="tfStart()" style="background:rgba(var(--primary-rgb),.15);color:var(--primary);border-color:rgba(var(--primary-rgb),.3)">Start</button>
        </div>
        <div style="margin-top:.65rem;display:flex;align-items:center;gap:.8rem;flex-wrap:wrap">
          <label style="font-size:.62rem;color:var(--dim);cursor:pointer;display:flex;align-items:center;gap:.35rem">
            <input id="tf-file" type="file" accept=".torrent" style="display:none" onchange="tfFileChanged(this)">
            <span id="tf-file-label" style="border:1px dashed var(--border);border-radius:5px;padding:.15rem .45rem;font-size:.58rem;color:var(--dim)">.torrent file</span>
          </label>
          <span id="tf-file-name" style="font-size:.6rem;color:var(--dim);font-family:var(--mono)"></span>
          <div style="flex:1"></div>
          <span style="font-size:.56rem;color:var(--dim);text-transform:uppercase;letter-spacing:.05em">API key</span>
          <input data-key-sync id="tf-api-key" type="password" placeholder="admin bearer" value="${esc(tfKey)}" style="width:150px;font-family:var(--mono);font-size:.66rem;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:.25rem .45rem" oninput="setApiKey(this.value)">
        </div>
      </div>
      ` : '<div style="margin-bottom:.85rem;padding:.5rem;background:var(--surface2);border:1px solid var(--border);border-radius:7px;font-size:.66rem;color:var(--dim)">read-only mode (follower) — transfers need the writer node</div>'}
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>ID</th><th>Bucket</th><th>Key</th><th>Status</th><th>Progress</th><th>Completion</th><th>Kind</th><th></th></tr></thead>
          <tbody>${rows || '<tr><td colspan="8" style="color:var(--dim)">no transfers yet</td></tr>'}</tbody>
        </table>
      </div>`;
    $('tf-bucket').value = D.buckets && D.buckets[0] && D.buckets[0].name || '';
  }

  window.tfFileChanged = function(el) {
    const name = el.files && el.files[0] ? el.files[0].name : '';
    $('tf-file-label').textContent = name || '.torrent file';
    $('tf-file-name').textContent = name ? 'picked, clears URL field' : '';
    if (name) $('tf-url').value = '';
  };

  window.tfStart = async function() {
    const bucket = $('tf-bucket') ? $('tf-bucket').value : '';
    if (!bucket) return alert('select a bucket first');
    const urlEl = $('tf-url');
    const url = urlEl ? urlEl.value.trim() : '';
    const fileEl = $('tf-file');
    const file = fileEl && fileEl.files[0];
    const keyEl = $('tf-key');
    const key = keyEl ? keyEl.value.trim() : '';
    if (!apiKey()) return alert('enter an admin API key in the field above');

    const enc = encodeURIComponent;
    const qs = key ? '?key=' + enc(key) : '';
    const uri = location.origin + '/v1/buckets/' + enc(bucket) + '/transfers' + qs;
    const hd = hdrs({});

    let res;
    try {
      if (file) {
        hd['Content-Type'] = 'application/x-bittorrent';
        res = await fetch(uri, { method: 'POST', headers: hd, body: file });
      } else if (url) {
        hd['Content-Type'] = 'application/json';
        const body = url.startsWith('magnet:') ? { magnet: url } : { url: url };
        res = await fetch(uri, { method: 'POST', headers: hd, body: JSON.stringify(body) });
      } else {
        return alert('enter a URL / magnet URI or choose a .torrent file');
      }
    } catch (err) {
      return alert('request failed: ' + err.message);
    }
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      return alert(e.error || res.statusText);
    }
    const d = await res.json();
    if (d.transfer) transfers.unshift(d.transfer);
    if (fileEl) fileEl.value = '';
    if ($('tf-file-label')) $('tf-file-label').textContent = '.torrent file';
    if ($('tf-file-name')) $('tf-file-name').textContent = '';
    render();
  };

  window.tfCancel = async function(bucket, id) {
    if (!apiKey()) return alert('enter an admin API key first');
    const res = await fetch(location.origin + '/v1/buckets/' + encodeURIComponent(bucket) + '/transfers/' + id, {
      method: 'DELETE', headers: hdrs({})
    });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      return alert(e.error || res.statusText);
    }
    const t = transfers.find(x => x.id === id);
    if (t) t.status = 'cancelled';
    render();
  };

  // Live refresh when an API key is stored (read scope suffices).
  setInterval(async () => {
    if (!apiKey() || !D.buckets || !D.buckets.length) return;
    try {
      const all = [];
      for (const b of D.buckets) {
        const r = await fetch(location.origin + '/v1/buckets/' + encodeURIComponent(b.name) + '/transfers', {
          headers: hdrs({})
        });
        if (!r.ok) continue;
        const d = await r.json();
        if (d.transfers) all.push(...d.transfers);
      }
      transfers = all;
      render();
    } catch (e) {}
  }, 4000);

  render();
})();

// ── Durability & Hardening ───────────────────────────────────────────
(function(){
  const items = D.checks.map(c => {
    const icon = c.status === 'pass' ? '✓' : c.status === 'warn' ? '⚠' : '✗';
    return `<div class="check-item check-${c.status}"><span class="check-icon">${icon}</span><span>${c.item}</span></div>`;
  }).join('');
  $('checks-body').innerHTML = `<div class="check-grid">${items}</div>`;
})();

// ── Lifecycle ────────────────────────────────────────────────────────
(function(){
  const ms = D.milestones.map(m =>
    `<div class="milestone">
      <div class="ms-dot ${m.done ? 'done' : ''}"></div>
      <div class="ms-chip">${m.label}</div>
      <div class="ms-date">${m.date}</div>
    </div>`
  ).join('');
  $('milestones-body').innerHTML =
    `<div class="timeline-scroll"><div class="timeline-track">${ms}</div></div>`;
})();

// ── Endpoints ────────────────────────────────────────────────────────
(function(){
  const rows = D.endpoints.map(e =>
    `<tr>
      <td><span class="meth ${e.method}">${e.method}</span></td>
      <td class="api-path">${e.path}</td>
      <td style="font-size:.66rem;color:var(--dim)">${e.desc}</td>
    </tr>`
  ).join('');
  $('endpoints-body').innerHTML =
    `<table><thead><tr><th>Method</th><th>Path</th><th>Purpose</th></tr></thead><tbody>${rows}</tbody></table>`;
})();

// ── Quickstart ───────────────────────────────────────────────────────
$('quickstart-body').innerHTML =
  `<pre class="code-block">${D.quickstart}</pre>`;

restoreCards();
</script>
</body>
